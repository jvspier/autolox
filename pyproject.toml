[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolox"
version = "0.1.0"
description = "Bulk NFC card enrolment for Loxone Miniservers"
readme = "CLAUDE.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "autolox maintainers" },
]

dependencies = [
    "httpx>=0.27",
    "websockets>=13,<14",     # legacy submodule kept; not currently used, but pinning defensively
    "pycryptodome>=3.20",
    "unidecode>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Fedora ships Python 3.14+; older deps that reach for `cgi` (removed in 3.13)
# need this shim. Not required on Debian/Ubuntu LXCs running 3.11/3.12.
py314-shims = ["legacy-cgi>=2.6"]

# Phase-3 web app dependencies. `pip install -e .[web]` picks these up.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.scripts]
loxone-bulk-enroll = "loxone_bulk_enroll:main"
autolox-web = "autolox_web.__main__:main"

[tool.setuptools]
packages = ["autolox", "autolox_web"]
py-modules = ["loxone_bulk_enroll"]

# HTML templates and static assets (CSS/JS) live inside autolox_web
# and need to travel with the package for non-editable installs and
# built wheels.
[tool.setuptools.package-data]
autolox_web = ["templates/*.html", "static/*.js", "static/*.css"]
